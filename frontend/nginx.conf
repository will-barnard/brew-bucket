server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backups and artifacts are large. Without this nginx rejects the upload
    # with a 413 long before the backend ever sees it.
    client_max_body_size 0;
    client_body_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # Streaming matters more than buffering here: buffering a multi-GB upload
    # to nginx's disk doubles the write and stalls the transfer.
    proxy_request_buffering off;
    proxy_buffering off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /healthz {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;
    }

    location /api/ {
        # Resolved per request via Docker's embedded DNS: a static upstream
        # crashes nginx at boot when the backend container isn't up yet, and
        # without ipv6=off the AAAA lookup returns SERVFAIL at request time.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public share links.
    location /s/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $share_upstream http://backend:3001;
        proxy_pass $share_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Git smart-HTTP.
    location /git/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $git_upstream http://backend:3001;
        proxy_pass $git_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
